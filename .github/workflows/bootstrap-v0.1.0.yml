name: Bootstrap v0.1.0 Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-v0.1.0.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify application version
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          expected = "0.1.0"
          config = Path("config/config.yaml").read_text(encoding="utf-8")
          match = re.search(r'^\s*version:\s*"([^"]+)"\s*$', config, re.MULTILINE)

          if match is None:
              raise SystemExit("application.version was not found")

          actual = match.group(1)
          if actual != expected:
              raise SystemExit(
                  f"Configured version {actual!r} does not match expected {expected!r}"
              )
          PY

      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse "refs/tags/v0.1.0" >/dev/null 2>&1; then
            echo "Tag v0.1.0 already exists."
            exit 1
          fi

          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists."
            exit 1
          fi

      - name: Create version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.1.0 "$GITHUB_SHA" -m "MultiRAG Clean v0.1.0"
          git push origin v0.1.0

      - name: Create release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## MultiRAG Clean v0.1.0

          First tagged open-source release of MultiRAG Clean.

          ### Highlights
          - FastAPI service for datasets, vector search, RAG systems, access control, and streamed chat.
          - Local development profile using SQLite, deterministic fake embeddings, and a fake chat provider.
          - Production-oriented deployment with PostgreSQL/pgvector, Jina embeddings, vLLM, Docker Compose, health checks, and non-root containers.
          - API-key authorization with admin and user ownership boundaries.
          - Apache-2.0 licensing, contributor/security/support policies, roadmap, changelog, and maintainer documentation.
          - CI, deterministic unit/integration coverage, CodeQL scanning, Dependabot, CODEOWNERS, and issue/PR templates.

          ### Known follow-up
          - Add versioned database migrations before the first production schema change.
          - Continue expanding deterministic integration and authorization coverage.

          See README.md, ROADMAP.md, CHANGELOG.md, and docs/maintenance.md for details.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            --verify-tag \
            --title "MultiRAG Clean v0.1.0" \
            --notes-file release-notes.md

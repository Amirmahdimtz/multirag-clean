name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "PyYAML>=6.0,<7" \
            "SQLAlchemy>=2.0,<3" \
            "aiosqlite>=0.20,<1" \
            "alembic==1.20.0" \
            "ruff>=0.8,<1" \
            "coverage[toml]>=7.6,<8"

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Lint Python sources
        run: python -m ruff check src tests alembic main.py scripts

      - name: Compile Python sources
        run: python -m compileall -q src tests alembic main.py scripts

      - name: Run unit and integration tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -p "test_*.py" -v
          python -m coverage report

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify tag version matches application version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          config = Path("config/config.yaml").read_text(encoding="utf-8")
          match = re.search(r'^\s*version:\s*"([^"]+)"\s*$', config, re.MULTILINE)

          if match is None:
              raise SystemExit("application.version was not found in config/config.yaml")

          expected = f"v{match.group(1)}"
          if tag != expected:
              raise SystemExit(
                  f"Tag {tag!r} does not match configured application version {expected!r}"
              )
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
